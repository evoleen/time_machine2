name: Sanity Test

on:
  push:
  pull_request:

# A newer push to a pull request cancels the run for the older commit.
# Push runs each get their own group, so they're never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Sanity:
    name: Sanity (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Local time zone from the /etc/localtime symlink (UTC on runners)
          - name: Ubuntu
            id: ubuntu
            os: ubuntu-latest
          # Local time zone from the TZ environment variable, with DST
          - name: Ubuntu, TZ=Australia/Sydney
            id: ubuntu-tz
            os: ubuntu-latest
            tz: Australia/Sydney
          # macOS links /etc/localtime into /var/db/timezone/zoneinfo.
          # Paused: GitHub-hosted macOS arm64 runners are at capacity, so jobs
          # were cancelled before starting ("not acquired by Runner").
          # - name: macOS
          #   id: macos
          #   os: macos-latest
          # Windows zone ID mapped with CLDR, with DST
          - name: Windows (English)
            id: windows-en
            os: windows-latest
            windows_time_zone: AUS Eastern Standard Time
          # As on German Windows: localized display names, English zone ID.
          # The tests fail if the display names aren't actually localized.
          - name: Windows (non-English)
            id: windows-localized
            os: windows-latest
            windows_time_zone: W. Europe Standard Time
            windows_standard_name: Mitteleuropäische Zeit
            windows_daylight_name: Mitteleuropäische Sommerzeit
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 👴🏼 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🏗️ Install packages
        id: pub-get
        run: dart pub get

      - name: 🕐 Set Windows time zone
        if: matrix.windows_time_zone
        shell: pwsh
        run: tzutil /s "${{ matrix.windows_time_zone }}"

      - name: 🌐 Use localized Windows time zone names
        if: matrix.windows_standard_name
        shell: pwsh
        run: >
          ./.github/scripts/set-windows-time-zone-names.ps1
          -Standard "${{ matrix.windows_standard_name }}"
          -Daylight "${{ matrix.windows_daylight_name }}"

      - name: 📘 Run unit & integration tests
        shell: bash
        env:
          TIME_MACHINE_EXPECT_LOCALIZED_WINDOWS: ${{ matrix.windows_standard_name && '1' || '' }}
          # The zone test/system_source checks SystemDateTimeZoneSource's
          # systemDefaultId against (skipped when empty).
          TIME_MACHINE_EXPECT_SYSTEM_TIME_ZONE: ${{ matrix.tz || matrix.windows_time_zone || '' }}
        run: |
          # Only set TZ when asked: an empty TZ means UTC.
          if [ -n "${{ matrix.tz }}" ]; then export TZ="${{ matrix.tz }}"; fi
          dart test \
            --coverage=coverage/raw \
            --file-reporter=json:test-results/tests.json

      - name: 🧰 Run TZDB compiler tests
        # Also when the main tests failed, so that both sets of results are reported.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: dart test tool/tzdb_compiler/test --file-reporter=json:test-results/compiler-tests.json

      - name: 📈 Convert coverage to LCOV
        if: ${{ !cancelled() && hashFiles('coverage/raw/**') != '' }}
        shell: bash
        run: |
          dart run coverage:format_coverage --lcov --check-ignore \
            --report-on=lib --base-directory=. \
            --in=coverage/raw --out=coverage/lcov.info
          # Use the same relative paths on every OS so the reports can be merged.
          # -i.bak works with both GNU and BSD (macOS) sed.
          sed -i.bak '/^SF:/ s|\\|/|g' coverage/lcov.info && rm -f coverage/lcov.info.bak

      - name: 🟣 Setup .NET for ReportGenerator
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 📊 Summarize coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          # Outside the workspace, so pub publish --dry-run doesn't see the tool
          toolpath: ${{ runner.temp }}/reportgeneratortool
          reports: coverage/lcov.info
          targetdir: coverage/report
          reporttypes: MarkdownSummaryGithub
          title: Coverage on ${{ matrix.name }}

      - name: 📝 Add coverage to job summary
        if: ${{ !cancelled() && hashFiles('coverage/report/SummaryGithub.md') != '' }}
        shell: bash
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.id }}
          path: |
            test-results/
            coverage/lcov.info

      - name: Validate package
        run: dart pub publish --dry-run

  # SystemDateTimeZoneSource on the web: the platform-agnostic checks in
  # test/system_source, as on Android and iOS below.
  Web:
    name: System time zones (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web, JavaScript in Chrome
            id: web-js
            platform: chrome
            compiler: dart2js
          - name: Web, WebAssembly in Chrome
            id: web-wasm
            platform: chrome
            compiler: dart2wasm
          - name: Web, JavaScript in Node.js
            id: web-node
            platform: node
            compiler: dart2js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A zone with DST, so the checked offsets change through the year.
      # Chrome and Node.js on Linux follow TZ (Intl and Date both).
      TZ: Europe/Berlin
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 👴🏼 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🏗️ Install packages
        run: dart pub get

      - name: 🌐 Run system time zone checks
        run: >
          dart test test/system_source
          --platform ${{ matrix.platform }}
          --compiler ${{ matrix.compiler }}
          --file-reporter=json:test-results/system-source.json

      - name: 📤 Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.id }}
          path: test-results/

  # SystemDateTimeZoneSource in a Flutter app on an Android emulator: the same
  # checks, from test_apps/system_source_flutter/integration_test.
  Android:
    name: System time zones (Android API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # tzdata in the time zone APEX (/apex/com.android.tzdata), Android 10+
          - api-level: 35
            target: google_apis
          # tzdata in /system/usr/share/zoneinfo, from before the APEX
          - api-level: 28
            target: default
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIME_ZONE: America/New_York
    defaults:
      run:
        working-directory: test_apps/system_source_flutter
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      # Hardware acceleration for the emulator, as android-emulator-runner's
      # README describes.
      - name: ⚡ Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🏗️ Install packages
        run: flutter pub get

      # Fails fast if the Gradle setup is broken, before the emulator starts,
      # and downloads Gradle and its dependencies.
      - name: 🔨 Build the test app
        run: flutter build apk --debug

      - name: 🤖 Run system time zone checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -timezone ${{ env.TIME_ZONE }}
          working-directory: test_apps/system_source_flutter
          # Each line runs on its own.
          script: |
            adb shell getprop persist.sys.timezone
            flutter test integration_test --device-id emulator-5554 --reporter expanded --file-reporter json:${{ github.workspace }}/test-results/system-source.json --dart-define=TIME_MACHINE_EXPECT_SYSTEM_TIME_ZONE=${{ env.TIME_ZONE }}

      - name: 📝 Add test results to job summary
        if: ${{ !cancelled() }}
        working-directory: .
        run: >
          ./.github/scripts/summarize-test-results.sh
          "Android API ${{ matrix.api-level }}"
          test-results/system-source.json >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results-android-${{ matrix.api-level }}
          path: test-results/

  # The same Flutter checks on an iOS Simulator. Separate from the final
  # report, because macOS runners can queue for a long time: it publishes its
  # own "Test Results (iOS)" check.
  iOS:
    name: System time zones (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    env:
      TIME_ZONE: Australia/Sydney
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      # The Simulator uses the Mac's time zone when it boots.
      - name: 🕐 Set the Mac's time zone
        # systemsetup -settimezone reports error -99 on GitHub's runners, so
        # point /etc/localtime at the zone directly.
        run: |
          sudo ln -sf "/var/db/timezone/zoneinfo/$TIME_ZONE" /etc/localtime
          ls -l /etc/localtime
          date
          case "$(readlink /etc/localtime)" in
            */zoneinfo/"$TIME_ZONE") ;;
            *) echo "::error::/etc/localtime doesn't point at $TIME_ZONE"; exit 1 ;;
          esac

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🏗️ Install packages
        working-directory: test_apps/system_source_flutter
        run: flutter pub get

      # The newest iPhone on the newest iOS runtime that Xcode has.
      - name: 📱 Boot an iOS Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries | sort_by(.key)[]
              | select(.key | contains(".iOS-")) | .value[]
              | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: 🍎 Run system time zone checks on the Simulator
        working-directory: test_apps/system_source_flutter
        run: >
          flutter test integration_test
          --device-id ${{ steps.simulator.outputs.udid }}
          --reporter expanded
          --file-reporter json:${{ github.workspace }}/test-results/system-source.json
          --dart-define=TIME_MACHINE_EXPECT_SYSTEM_TIME_ZONE=${{ env.TIME_ZONE }}

      - name: 📝 Add test results to job summary
        if: ${{ !cancelled() }}
        run: >
          ./.github/scripts/summarize-test-results.sh
          "iOS Simulator"
          test-results/system-source.json >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Not results-*: the final report doesn't wait for this job.
          name: ios-results
          path: test-results/

      # Skipped for pull requests from forks, whose token can't create checks.
      - name: 🧪 Publish test results
        if: >-
          ${{ !cancelled()
          && hashFiles('test-results/*.json') != ''
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          files: test-results/*.json
          check_name: Test Results (iOS)
          comment_mode: 'off'

  # pub.dev's scoring (pana): the package must keep supporting everywhere Dart
  # runs. Fails if pana stops reporting any of these tags, e.g. because a
  # dart:io or dart:html import becomes reachable on the web or in WebAssembly.
  Pana:
    name: Platform support (pana)
    runs-on: ubuntu-latest
    env:
      REQUIRED_TAGS: >-
        platform:android platform:ios platform:linux platform:macos
        platform:web platform:windows
        runtime:native-aot runtime:native-jit runtime:web
        is:wasm-ready sdk:dart sdk:flutter
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🔎 Run pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --json . > pana.json
          {
            echo "### pana"
            echo
            jq -r '.report.sections[] | "- \(.grantedPoints)/\(.maxPoints) \(.title)"' pana.json
            echo
            echo "Tags: $(jq -r '.tags | join(", ")' pana.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ✅ Check platform support
        run: |
          missing=""
          for tag in $REQUIRED_TAGS; do
            jq -e --arg tag "$tag" '.tags | index($tag)' pana.json > /dev/null || missing="$missing $tag"
          done
          if [ -n "$missing" ]; then
            echo "::error::pana no longer reports:$missing"
            exit 1
          fi
          echo "All required tags present: $REQUIRED_TAGS"

  Report:
    name: Test results and coverage
    # Not iOS, which can queue for a long time; it publishes its own check.
    needs: [Sanity, Web, Android]
    # Also when tests failed, but not when the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # The sources are needed for the line-by-line HTML coverage report.
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download test results and coverage
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: artifacts

      # Job summary, a "Test Results" check run and, on pull requests, a
      # comment that is updated in place. Pull requests from forks only get the
      # job summary, because their token is read-only.
      - name: 🧪 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: artifacts/**/test-results/*.json
          check_name: Test Results
          # Push runs would otherwise also comment on the branch's pull request.
          comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}
          # Show a failure on each platform, not only on the first one.
          report_individual_runs: true

      - name: 🟣 Setup .NET for ReportGenerator
        if: ${{ !cancelled() && hashFiles('artifacts/**/lcov.info') != '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 📊 Merge coverage of all platforms
        if: ${{ !cancelled() && hashFiles('artifacts/**/lcov.info') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          # Outside the workspace, so pub publish --dry-run doesn't see the tool
          toolpath: ${{ runner.temp }}/reportgeneratortool
          reports: artifacts/**/lcov.info
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub
          title: Coverage (all platforms)

      - name: 📝 Add coverage to job summary
        if: ${{ !cancelled() && hashFiles('coverage-report/SummaryGithub.md') != '' }}
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload HTML coverage report
        if: ${{ !cancelled() && hashFiles('coverage-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/

      # Updates its own earlier comment. Skipped for pull requests from forks,
      # whose token can't comment.
      - name: 💬 Comment coverage on pull request
        if: >-
          ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('coverage-report/SummaryGithub.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-report/SummaryGithub.md
